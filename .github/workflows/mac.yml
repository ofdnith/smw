name: App para macOS (Tauri)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx playwright install chromium
      - name: Gera o ícone a partir do sprite da Lumi
        run: node tools/icon.mjs && npx tauri icon app-icon.png -o src-tauri/icons
      - name: Compila o app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
      - name: Versão (da tag, ou do package.json ao rodar manualmente)
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - name: Publica a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lumi ${{ steps.ver.outputs.tag }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
